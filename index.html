<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regard Social - Prisme</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
            background: #f5f5f5;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <span>Chargement du Regard Social...</span>
    </div>

    <script>
        // Configuration : URL à récupérer depuis un fichier JSON
        const CONFIG_URL = 'https://tokasur.github.io/regard-social/config.json';
        
        async function getLatestURL() {
            try {
                const response = await fetch(CONFIG_URL);
                const config = await response.json();
                return config.latest_url;
            } catch (error) {
                console.error('Erreur lors de la récupération de l\'URL:', error);
                // URL par défaut en cas d'erreur
                return 'https://prisme.netboard.me/20251114/';
            }
        }

        async function loadRegardSocial() {
            const url = await getLatestURL();
            
            // Créer l'iframe avec l'URL
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.allow = "fullscreen";
            iframe.title = "Regard Social - Prisme";
            
            // Masquer le chargement et afficher l'iframe
            document.getElementById('loading').style.display = 'none';
            document.body.appendChild(iframe);
        }

        // Charger au démarrage
        loadRegardSocial();
    </script>
</body>
</html>
