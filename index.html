<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regard Social - Prisme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #333;
            background: #f5f5f5;
            z-index: 9999;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e91e63;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #regard-social-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        
        #regard-social-frame.loaded {
            display: block;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <span>Chargement du Regard Social...</span>
    </div>

    <iframe id="regard-social-frame" name="regard-social-frame" allowfullscreen></iframe>

    <script>
        const CONFIG_URL = './config.json';
        
        async function loadRegardSocial() {
            try {
                console.log('Chargement de config.json...');
                const response = await fetch(CONFIG_URL);
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP ${response.status}`);
                }
                
                const config = await response.json();
                console.log('Config chargée:', config);
                
                if (!config.latest_url) {
                    throw new Error('URL non trouvée dans config.json');
                }
                
                const iframe = document.getElementById('regard-social-frame');
                
                // Masquer le loading et afficher l'iframe quand elle est chargée
                iframe.onload = function() {
                    console.log('Iframe chargée');
                    document.getElementById('loading').style.display = 'none';
                    iframe.classList.add('loaded');
                };
                
                // Définir la source de l'iframe
                iframe.src = config.latest_url;
                console.log('URL chargée dans iframe:', config.latest_url);
                
                // Timeout de sécurité si l'iframe ne charge pas
                setTimeout(function() {
                    if (!iframe.classList.contains('loaded')) {
                        console.log('Timeout - affichage forcé');
                        document.getElementById('loading').style.display = 'none';
                        iframe.classList.add('loaded');
                    }
                }, 3000);
                
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <h2 style="color: #d32f2f;">⚠️ Erreur</h2>
                        <p>Impossible de charger le Regard Social.</p>
                        <p style="font-size: 0.9em; color: #666; margin-top: 10px;">${error.message}</p>
                        <p style="margin-top: 20px;">
                            <a href="https://prisme.netboard.me/" 
                               style="color: #e91e63; text-decoration: none; font-weight: bold;">
                                → Accéder directement au site Prisme
                            </a>
                        </p>
                    </div>
                `;
            }
        }
        
        // Démarrer le chargement
        loadRegardSocial();
    </script>
</body>
</html>
