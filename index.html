<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regard Social - Prisme</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
            background: #f5f5f5;
        }
        #error {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #d32f2f;
            background: #ffebee;
            padding: 20px;
            text-align: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .error-details {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            max-width: 600px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <span>Chargement du Regard Social...</span>
    </div>

    <div id="error">
        <div class="error-icon">⚠️</div>
        <h2>Erreur de chargement</h2>
        <p>Impossible de charger le Regard Social.</p>
        <div class="error-details" id="error-message"></div>
    </div>

    <script>
        const CONFIG_URL = './config.json';
        
        async function loadRegardSocial() {
            try {
                console.log('Récupération du fichier config.json...');
                
                // Récupérer le fichier config.json
                const response = await fetch(CONFIG_URL);
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP ${response.status}: ${response.statusText}`);
                }
                
                const config = await response.json();
                console.log('Config chargée:', config);
                
                if (!config.latest_url) {
                    throw new Error('Le fichier config.json ne contient pas de "latest_url"');
                }
                
                const url = config.latest_url;
                console.log('URL du Regard Social:', url);
                
                // Créer l'iframe avec l'URL
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.allow = "fullscreen";
                iframe.title = "Regard Social - Prisme";
                
                // Masquer le chargement et afficher l'iframe
                document.getElementById('loading').style.display = 'none';
                document.body.appendChild(iframe);
                
            } catch (error) {
                console.error('Erreur:', error);
                
                // Afficher l'erreur à l'utilisateur
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'flex';
                document.getElementById('error-message').innerHTML = `
                    <strong>Détails de l'erreur :</strong><br>
                    ${error.message}<br><br>
                    <strong>Fichier config.json :</strong><br>
                    ${CONFIG_URL}<br><br>
                    <small>Vérifiez que le fichier config.json existe et contient une URL valide.</small>
                `;
            }
        }
        
        // Charger au démarrage
        loadRegardSocial();
    </script>
</body>
</html>
