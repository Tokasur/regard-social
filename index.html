<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regard Social - Prisme</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
            background: #f5f5f5;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e91e63;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <span>Chargement du Regard Social...</span>
    </div>

    <script>
        const CONFIG_URL = './config.json';
        
        async function redirectToLatest() {
            try {
                const response = await fetch(CONFIG_URL);
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP ${response.status}`);
                }
                
                const config = await response.json();
                
                if (!config.latest_url) {
                    throw new Error('URL non trouvée dans config.json');
                }
                
                // Redirection immédiate vers l'URL du Regard Social
                window.location.replace(config.latest_url);
                
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('loading').innerHTML = `
                    <div style="text-align: center; padding: 20px;">
                        <h2 style="color: #d32f2f;">⚠️ Erreur</h2>
                        <p>Impossible de charger le Regard Social.</p>
                        <p style="font-size: 0.9em; color: #666;">${error.message}</p>
                        <p style="margin-top: 20px;">
                            <a href="https://prisme.netboard.me/" style="color: #e91e63;">Accéder directement au site Prisme</a>
                        </p>
                    </div>
                `;
            }
        }
        
        // Lancer la redirection immédiatement
        redirectToLatest();
    </script>
</body>
</html>
