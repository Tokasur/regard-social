<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>
        // Récupérer l'URL depuis config.json et rediriger immédiatement
        fetch('./config.json')
            .then(r => r.json())
            .then(config => {
                if (config.latest_url) {
                    window.location.replace(config.latest_url);
                }
            })
            .catch(() => {
                // En cas d'erreur, rediriger vers la page principale
                window.location.replace('https://prisme.netboard.me/');
            });
    </script>
</head>
<body>
    <p>Redirection...</p>
</body>
</html>
